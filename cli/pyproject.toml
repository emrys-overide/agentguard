[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melch-agentguard"
version = "0.1.0"
description = "Local-First AI Agent Safety Harness & Adversarial Benchmark CLI by MELCH TECH"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MELCH TECH Engineering", email = "engineering@melchtech.com" }
]
keywords = ["ai", "security", "agent-safety", "prompt-injection", "tool-restraint", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
