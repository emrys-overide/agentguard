name = "melch-agentguard-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "agentguard-db"
database_id = "agentguard-d1-placeholder-id" # Run 'wrangler d1 create agentguard-db' and replace this

[vars]
ENVIRONMENT = "production"
RESEND_FROM_EMAIL = "AgentGuard <licensing@melchtech.com>"

# Encrypted Secrets to set via 'wrangler secret put <KEY>':
# - POLAR_WEBHOOK_SECRET
# - PAYSTACK_SECRET_KEY
# - LICENSE_SECRET_KEY
# - RESEND_API_KEY
